name: Check and release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check formatting
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type-check
        run: deno task check
      - name: Run tests
        run: deno task test

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            output: totem-windows-x64.exe
          - platform: linux-x64
            runner: ubuntu-latest
            output: totem-linux-x64
          - platform: macos-x64
            runner: macos-15-intel
            output: totem-macos-x64
          - platform: macos-arm64
            runner: macos-14
            output: totem-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build standalone binary
        run: |
          deno eval "await Deno.mkdir('dist', { recursive: true });"
          deno compile --allow-read --allow-write --allow-env --allow-run --output "dist/${{ matrix.output }}" src/main.ts
      - name: Archive POSIX binary
        if: runner.os != 'Windows'
        run: tar -czf "dist/${{ matrix.output }}.tar.gz" -C dist "${{ matrix.output }}"
      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: totem-${{ matrix.platform }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
      - name: Upload POSIX binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: totem-${{ matrix.platform }}
          path: dist/${{ matrix.output }}.tar.gz
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            output: totem-desktop-windows-x64.msi
            artifact: totem-desktop-windows-x64.msi
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: totem-desktop-linux-x64.AppImage
            artifact: totem-desktop-linux-x64.AppImage
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            output: Totem.app
            artifact: totem-desktop-macos-x64.tar.gz
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            output: Totem.app
            artifact: totem-desktop-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build desktop app
        run: deno desktop --allow-read --allow-write --allow-env --allow-run --target ${{ matrix.target }} --output "dist/${{ matrix.output }}" src/desktop.ts
      - name: Archive macOS app bundle
        if: runner.os == 'macOS'
        run: tar -czf "dist/${{ matrix.artifact }}" -C dist Totem.app
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: totem-desktop-${{ matrix.platform }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          pattern: totem-*
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-binaries
          sha256sum $(ls | grep -v SHA256SUMS) > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for f in release-binaries/*; do
            echo "uploading $f"
            for i in 1 2 3; do
              timeout 300 gh release upload "$GITHUB_REF_NAME" "$f" --clobber && break
              echo "retry $i for $f"
            done
          done
